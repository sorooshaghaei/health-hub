name: Verify foundation

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/quality.yml"
      - "docker-compose.yml"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build application frontend
        working-directory: frontend
        run: npm run build

      - name: Build GitHub Pages demo
        working-directory: frontend
        run: npm run build:demo

  backend:
    name: Django with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: health_hub
          POSTGRES_USER: health_hub
          POSTGRES_PASSWORD: health_hub_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health_hub -d health_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: health-hub-ci-secret-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      POSTGRES_DB: health_hub
      POSTGRES_USER: health_hub
      POSTGRES_PASSWORD: health_hub_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TIME_ZONE: UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Verify committed migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to PostgreSQL
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run backend tests against PostgreSQL
        working-directory: backend
        run: python manage.py test
